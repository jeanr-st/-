<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Development Environment</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 680px);
        padding: clamp(32px, 7vw, 64px);
        border: 1px solid #dce4ef;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 24px 70px rgba(30, 51, 80, 0.12);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 24px;
        color: #17603a;
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .status::before {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #1f9d5a;
        content: "";
        box-shadow: 0 0 0 5px #dff5e9;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 7vw, 4.5rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      p {
        max-width: 52ch;
        margin: 24px 0 0;
        color: #526078;
        font-size: 1.075rem;
        line-height: 1.7;
      }

      code {
        padding: 3px 7px;
        border: 1px solid #d9e1ec;
        border-radius: 6px;
        color: #26344d;
        background: #f5f7fa;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status">Environment ready</div>
      <h1>Start building here.</h1>
      <p>
        This repository now has a Docker-based development environment. Edit
        <code>index.html</code> and refresh the preview to see your changes.
      </p>
    </main>
  </body>
</html>
